name: Sync rules to Qodo

on:
  push:
    branches: [main]
    paths:
      - "rules/**"
      - "scripts/sync_rules.py"
      - ".github/workflows/sync-rules.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change without writing to Qodo"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-rules
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync:
    runs-on: ubuntu-latest
    # QODO_API_KEY lives in this environment, whose branch policy allows only
    # main — so branch and PR builds can never read it.
    environment: qodo-sync
    # A manual dispatch can pick any ref. Only main's rules may be written to
    # Qodo, even if the environment's branch policy is misconfigured.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The next step hands the admin key to this binary, so no unpinned code
      # runs here. This skips install.sh (a mutable script) and fetches one
      # exact release, which must match the digest pinned below. To upgrade:
      # read the new version's sha256 from
      # https://get.qodo.ai/releases/<version>/release.json and change both values.
      - name: Install qodo CLI (pinned)
        env:
          QODO_CLI_VERSION: 2.3.0
          QODO_CLI_SHA256: 563834e8044f8c60c815b6353d837e6ccebb2f27c7e9dab55781a8c37458f09c
        run: |
          mkdir -p "$HOME/.qodo/bin"
          curl -fsSL -o "$HOME/.qodo/bin/qodo.mjs" \
            "https://get.qodo.ai/releases/${QODO_CLI_VERSION}/qodo.mjs"
          echo "${QODO_CLI_SHA256}  $HOME/.qodo/bin/qodo.mjs" | sha256sum -c -
          printf '#!/bin/sh\nexec node "%s" "$@"\n' "$HOME/.qodo/bin/qodo.mjs" > "$HOME/.qodo/bin/qodo"
          chmod +x "$HOME/.qodo/bin/qodo"
          "$HOME/.qodo/bin/qodo" --version

      - name: Log in to Qodo
        env:
          QODO_API_KEY: ${{ secrets.QODO_API_KEY }}
          QODO_SDK_BASE_URL: ${{ vars.QODO_SDK_BASE_URL }}
        run: |
          if [ -z "$QODO_API_KEY" ]; then
            echo "::error::QODO_API_KEY is not set in the qodo-sync environment"
            exit 1
          fi
          if [ -z "$QODO_SDK_BASE_URL" ]; then
            echo "::error::QODO_SDK_BASE_URL repo variable is not set. Every"
            echo "::error::workspace has its own SDK URL — read yours from"
            echo "::error::'qodo whoami --json' (field sdkBaseUrl) and set it under"
            echo "::error::Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          "$HOME/.qodo/bin/qodo" login \
            --api-key "$QODO_API_KEY" \
            --base-url "$QODO_SDK_BASE_URL" \
            --insecure-storage
          "$HOME/.qodo/bin/qodo" whoami --json

      - name: Sync rules
        env:
          QODO_BIN: /home/runner/.qodo/bin/qodo
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          # ubuntu-latest's system Python is externally managed (PEP 668).
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'pyyaml==6.0.2'
          "$RUNNER_TEMP/venv/bin/python" scripts/sync_rules.py
