# Copy into `rules/` and adjust. Nothing under `examples/` is synced.
#
# SHAPE-ONLY — correct in form, but not tightened. Before adopting it, name the
# cases that should PASS in `good_examples`; this one only shows the ideal
# case, so a reviewer has nothing to pass over. See ../README.md.

name: "Never hardcode secrets in source or configuration"
category: Security
severity: error
content: >-
  Never commit credentials, API keys, tokens, private keys, or connection
  strings to the repository, including in test fixtures and sample config.
  Read them from a secret manager or the process environment at runtime.
good_examples: |
  DB_PASSWORD = os.environ["DB_PASSWORD"]
  const token = await secrets.get("payments/stripe-key");
bad_examples: |
  DB_PASSWORD = "hunter2-prod"
  const token = "sk-live-4f8a2b91c3...";
