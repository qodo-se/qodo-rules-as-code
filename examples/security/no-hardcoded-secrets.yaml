# Copy into `rules/` and adjust. Nothing under `examples/` is synced.
#
# PROHIBITION with a carve-out — an absolute ban on an observable pattern,
# bounded by the one context where the pattern is harmless. Decidable from the
# changed lines alone.
#
# Three details doing real work:
#  - the subject of the ban is a *functional* credential, not "a literal near
#    the word key". Without that, the rule flags key ids, client ids, public
#    keys, and every placeholder in the test suite, and the team turns it off.
#  - the carve-out for evidently synthetic placeholders lives in this rule's own
#    Success Criteria. A separate "test fixtures are fine" rule does not stop
#    this one from firing — exemptions have to be inside the rule they exempt.
#  - the reviewer is bounded explicitly: it must not try to decide whether a
#    value is currently valid, rotated, or revoked. It cannot, and unbounded it
#    invents the verification and reports on the invention.
#
# The failure criteria enumerate credential prefixes and formats. That
# enumeration is the rule's teeth — extend it with the providers you use, and
# keep it in the criteria rather than in `content`.
name: "Never hardcode functional secrets in source, configuration, or tests"
category: Security
severity: error
content: >-
  A value that could authenticate against a real system must never appear as a
  literal in tracked files — not in source, not in configuration, not in test
  fixtures, and not as a fallback default behind an environment lookup. Read it
  at runtime from the process environment or a secret manager. The test is
  whether the literal is *functional*, judged from its shape: a live-key prefix,
  credential-grade entropy, or a real host paired with a password. Judge shape
  only — never attempt to determine whether a value is currently valid, rotated,
  or revoked, and never treat a value as safe because a comment says it is
  expired or fake.
good_examples: |
  PASSES when the secret is resolved at runtime rather than written down —
  directly, or through the service's own configuration accessor:
    api_key = os.environ["STRIPE_API_KEY"]          # also: Config.stripe_api_key
    token = secrets_client.get("payments/stripe-key")
    const token = process.env.STRIPE_API_KEY        # os.Getenv, System.getenv
  PASSES when a literal in a test or fixture is evidently synthetic and could
  authenticate nothing — a zero-filled, repeated-character, or clearly labelled
  placeholder:
    StripeClient(api_key="sk_test_000000000000000000000000")
    api_key = "unset"                               # or "x" * 32, "dummy"
  PASSES for values that are not secrets even though they sit beside them: key
  ids, client ids, account ids, public keys, `-----BEGIN PUBLIC KEY-----`,
  hostnames, and connection strings that carry no password:
    DATABASE_URL = "postgresql://billing@db.internal.example:5432/billing"
  PASSES when the code names *where* a secret lives rather than what it is —
  a variable name, a vault path, a secret-manager key, a CI secret reference:
    key: ${{ secrets.STRIPE_API_KEY }}
bad_examples: |
  VIOLATES when a literal is assigned to a credential-shaped name — anything
  matching key/token/secret/password/passwd/credential/private_key/api_key:
    DB_PASSWORD = "hunter2-prod"
    StripeClient(api_key="sk_live_4f8a2b91c3d7e5a0b2c4d6e8")
  VIOLATES when a real credential is the fallback default of an environment
  lookup. The lookup does not launder the literal:
    api_key = os.environ.get("STRIPE_API_KEY", "sk_live_4f8a2b91c3d7e5a0")
  VIOLATES on any literal carrying a recognized credential prefix or format,
  wherever it appears — source, YAML, Terraform, a CI workflow, a committed
  `.env`, or a Kubernetes Secret's `stringData`:
    sk_live_ / sk-live- / rk_live_   AKIA[0-9A-Z]{16}   ghp_ / gho_ / github_pat_
    xoxb- / xoxp-   AIza[0-9A-Za-z_-]{35}   eyJ… (a signed JWT)
    -----BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY-----
  VIOLATES when a connection string embeds a password, including in a test
  settings module or a docker-compose default:
    DATABASE_URL = "postgresql://billing:S3cr3t-prod@db.internal.example/billing"
  VIOLATES when the value is obfuscated rather than removed — base64, hex, or
  character-joined — and decodes to a credential. Obfuscation is not resolution:
    api_key = base64.b64decode("c2tfbGl2ZV80ZjhhMmI5MWMz").decode()
scopes:
  - /your-org/your-service/
