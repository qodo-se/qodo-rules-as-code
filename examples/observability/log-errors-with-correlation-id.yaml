# Copy into `rules/` and adjust. Nothing under `examples/` is synced.
#
# SHAPE-ONLY — correct in form, but not tightened. Before adopting it, name the
# cases that should PASS in `good_examples`; this one only shows the ideal
# case, so a reviewer has nothing to pass over. See ../README.md.

name: "Log errors as structured events carrying the request correlation id"
category: Observability
severity: warning
content: >-
  Emit logs as structured key/value events that include the request or trace
  correlation id, and never interpolate context into a bare message string.
  Logs without a correlation id cannot be joined into a single request's story.
good_examples: |
  logger.error("payment.capture_failed", extra={"request_id": ctx.request_id, "invoice_id": inv.id, "code": err.code})
bad_examples: |
  logger.error(f"capture failed for invoice {inv.id}: {err}")
