name: "Keep SQL out of HTTP handlers — call the repository layer"
category: Architecture
severity: recommendation
content: >-
  HTTP handlers must not build or execute SQL directly; they call a function in
  the repository layer, which owns every query. This keeps request handling
  free of persistence detail and gives queries one place to be reviewed.
good_examples: |
  @router.get("/invoices/{invoice_id}")
  async def get_invoice(invoice_id: str):
      return await invoices.get_by_id(invoice_id)
bad_examples: |
  @router.get("/invoices/{invoice_id}")
  async def get_invoice(invoice_id: str):
      return await db.fetch_one("SELECT * FROM invoices WHERE id = $1", invoice_id)
scopes:
  - /your-org/your-service/
