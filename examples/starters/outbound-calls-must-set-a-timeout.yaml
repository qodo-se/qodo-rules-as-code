name: "Outbound network calls must set an explicit timeout"
category: Reliability
severity: error
content: >-
  Every HTTP request, RPC, and database call to another service must pass an
  explicit timeout. Client library defaults are frequently unbounded, so one
  slow dependency exhausts the caller's connection pool and spreads the outage.
good_examples: |
  resp = requests.get(url, timeout=(3.05, 10))
  await fetch(url, { signal: AbortSignal.timeout(5000) });
bad_examples: |
  resp = requests.get(url)
  await fetch(url);
