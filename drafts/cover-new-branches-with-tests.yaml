# Copy into `rules/` and adjust. Nothing under `examples/` is synced.
#
# SHAPE-ONLY — correct in form, but not tightened. Before adopting it, name the
# cases that should PASS in `good_examples`; this one only shows the ideal
# case, so a reviewer has nothing to pass over. See ../README.md.

name: "Cover new conditional branches with tests"
category: Testability
severity: warning
content: >-
  A change that adds a conditional branch, an error path, or a new public
  function must add tests that exercise it, including the failure case. Assert
  on observable behaviour rather than on internal calls.
good_examples: |
  def test_refund_rejected_when_invoice_already_settled():
      inv = make_invoice(state="settled")
      with pytest.raises(InvoiceAlreadySettled):
          refund(inv, amount_cents=500)
bad_examples: |
  # New `if invoice.state == "settled": raise ...` branch shipped with only
  # the existing happy-path test for refund().
