# Copy into `rules/` and adjust. Nothing under `examples/` is synced.
#
# SHAPE-ONLY — correct in form, but not tightened. Before adopting it, name the
# cases that should PASS in `good_examples`; this one only shows the ideal
# case, so a reviewer has nothing to pass over. See ../README.md.

name: "Represent monetary amounts as integer minor units or decimals"
category: Correctness
severity: error
content: >-
  Store and compute money as integer minor units (cents) or a fixed-point
  decimal type, never as float or double. Binary floating point cannot
  represent most decimal fractions exactly, so sums and comparisons drift.
good_examples: |
  total_cents: int = sum(line.amount_cents for line in invoice.lines)
  amount = Decimal("19.99") * Decimal(quantity)
bad_examples: |
  total = sum(float(line.amount) for line in invoice.lines)
  if abs(paid - owed) < 0.01:  # papering over float drift
      settle(invoice)
